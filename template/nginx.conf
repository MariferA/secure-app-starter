server {
 listen 8080;
 server_name _;
 client_body_temp_path /tmp/client_temp;
 proxy_temp_path /tmp/proxy_temp;
 fastcgi_temp_path /tmp/fastcgi_temp;
 uwsgi_temp_path /tmp/uwsgi_temp;
 scgi_temp_path /tmp/scgi_temp;
 server_tokens off;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options DENY always;
 add_header Cache-Control "no-store" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' __API_CONNECT_ORIGINS__; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location / { try_files $uri $uri/ /index.html; }
 location /assets/ { try_files $uri =404; }
 location = /health { access_log off; return 200 'ok'; }
}
